context:
  version: "1.5.2"
  commit: "1b1c9d6f6dbf61535d3ff1a4118cc0011e03dc58"

package:
  name: bioconductor-spatialfda
  version: ${{ version }}

source:
  #this is currently the newest build from github
  #once this is reflected in bioconductor.org we might update the URL
  url: https://github.com/mjemons/spatialFDA/archive/${{ commit }}.tar.gz
  sha256: 8e55196946f505348455c5e304badd45bd3ee9b89354ca9fc4fd2936b58d2d9e

build:
  number: 0
  noarch: generic
  script: R CMD INSTALL --build . ${R_ARGS}

requirements:
  host:
    - r-base >=4.3
    - r-dplyr
    - r-ggplot2
    - r-patchwork
    - r-purrr
    - r-refund
    - bioconductor-spatialexperiment
    - r-spatstat.explore
    - r-spatstat.geom
    - bioconductor-summarizedexperiment
    - r-fda
    - r-tidyr
    - bioconductor-experimenthub
    - r-scales
    - bioconductor-s4vectors
    - r-mgcv

  run:
    - r-base >=4.3
    - r-dplyr
    - r-ggplot2
    - r-patchwork
    - r-purrr
    - r-refund
    - bioconductor-spatialexperiment
    - r-spatstat.explore
    - r-spatstat.geom
    - bioconductor-summarizedexperiment
    - r-fda
    - r-tidyr
    - bioconductor-experimenthub
    - r-scales
    - bioconductor-s4vectors
    - r-mgcv

tests:
  - script:
      - R -e "library(spatialFDA)"

about:
  homepage: https://github.com/mjemons/spatialFDA
  license: GPL-3.0-or-later
  summary: A Tool for Spatial Multi-sample Comparisons
  description: |
    spatialFDA is a package to calculate spatial statistics metrics. 
    The package takes a SpatialExperiment object and calculates spatial statistics metrics using the package spatstat.
    Then it compares the resulting functions across samples/conditions using functional additive models as implemented in the package refund. 
    Furthermore, it provides exploratory visualisations using functional principal component analysis, as well implemented in refund.